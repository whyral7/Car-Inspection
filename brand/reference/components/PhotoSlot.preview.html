<!-- @dsCard group="Inspection" height=240 subtitle="Empty, uploading, done, needs retake" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PhotoSlot</title></head>
<body class="tm-root" style="margin:0">
<div class="tm-pad"><div class="tm-photos" style="max-width:600px">
  <button class="tm-photo tm-photo--done" style="--car:var(--ink-500)"><span class="tm-photo__ok"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>Front</button>
  <button class="tm-photo tm-photo--done" style="--car:var(--ink-400)"><span class="tm-photo__ok"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>Front-left 45°</button>
  <button class="tm-photo tm-photo--busy"><span class="tm-photo__bar"><i style="--value:62%"></i></span>Left side · 62%</button>
  <button class="tm-photo tm-photo--retake"><span class="tm-photo__icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M8 4.5v4.5"/><circle cx="8" cy="12" r="0.6" fill="currentColor"/><circle cx="8" cy="8" r="6.5" stroke-width="1.6"/></svg></span>Rear · blurry, retake</button>
  <button class="tm-photo"><span class="tm-photo__icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6.5h3l1.5-2h5l1.5 2h3v9H3z"/><circle cx="10" cy="11" r="3"/></svg></span>Rear-right 45°</button>
  <button class="tm-photo"><span class="tm-photo__icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6.5h3l1.5-2h5l1.5 2h3v9H3z"/><circle cx="10" cy="11" r="3"/></svg></span>Odometer</button>
</div></div>
</body></html>
