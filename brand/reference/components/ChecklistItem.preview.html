<!-- @dsCard group="Inspection" height=360 subtitle="Rate one point; below Good asks for evidence" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ChecklistItem</title></head>
<body class="tm-root" style="margin:0">
<div style="max-width:480px">
  <div class="tm-check">
    <div class="tm-check__head"><div><div class="tm-check__name">Engine oil level and colour</div><div class="tm-check__hint">Pull the dipstick. Milky oil means a head gasket risk.</div></div><span class="tm-check__crit">Critical</span></div>
    <div class="tm-seg" role="group" aria-label="Rating"><button class="good" aria-pressed="true">Good</button><button class="fair" aria-pressed="false">Fair</button><button class="poor" aria-pressed="false">Poor</button><button class="na" aria-pressed="false">N/A</button></div>
  </div>
  <div class="tm-check">
    <div class="tm-check__head"><div><div class="tm-check__name">Front-left door</div><div class="tm-check__hint">Paint reading 214 µm, car average 118 µm.</div></div><span class="tm-check__crit">Panel</span></div>
    <div class="tm-seg" role="group" aria-label="Rating"><button class="good" aria-pressed="false">Good</button><button class="fair" aria-pressed="true">Fair</button><button class="poor" aria-pressed="false">Poor</button><button class="na" aria-pressed="false">N/A</button></div>
    <div class="tm-check__evidence"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6.5h3l1.5-2h5l1.5 2h3v9H3z"/><circle cx="10" cy="11" r="3"/></svg> Add a photo and a note to continue</div>
  </div>
</div>
</body></html>
