<!-- @dsCard group="Actions" height=200 subtitle="Primary, secondary, ghost, danger; loading and disabled" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body class="tm-root" style="margin:0">
<div class="tm-pad tm-stack">
  <div class="tm-row">
    <button class="tm-btn tm-btn--primary">Start inspection</button>
    <button class="tm-btn tm-btn--secondary">Save draft</button>
    <button class="tm-btn tm-btn--ghost">Skip for now</button>
    <button class="tm-btn tm-btn--danger">Delete photo</button>
  </div>
  <div class="tm-row">
    <button class="tm-btn tm-btn--primary" aria-disabled="true"><span class="tm-spinner" aria-hidden="true"></span>Analysing photos…</button>
    <button class="tm-btn tm-btn--secondary" disabled>Publish report</button>
  </div>
  <button class="tm-btn tm-btn--primary tm-btn--lg tm-btn--block">Publish report · 1 credit</button>
</div>
</body></html>
