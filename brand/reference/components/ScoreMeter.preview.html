<!-- @dsCard group="Report" height=200 subtitle="Overall score with five rising bars" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScoreMeter</title></head>
<body class="tm-root" style="margin:0">
<div class="tm-pad tm-stack" style="gap:var(--space-6)">
  <div class="tm-score" role="img" aria-label="Score 8.4 out of 10, very good">
    <div class="tm-score__num">8.4<small> /10</small></div>
    <div class="tm-score__bars" aria-hidden="true"><span class="on"></span><span class="on"></span><span class="on"></span><span class="tip"></span><span></span></div>
    <div class="tm-score__meta"><span class="tm-score__grade">Very good</span><span class="tm-score__sub">2 amber flags, no red flags</span></div>
  </div>
  <div class="tm-score" role="img" aria-label="Score 4.7 out of 10, below average">
    <div class="tm-score__num">4.7<small> /10</small></div>
    <div class="tm-score__bars" aria-hidden="true"><span class="on"></span><span class="tip"></span><span></span><span></span><span></span></div>
    <div class="tm-score__meta"><span class="tm-score__grade">Below average</span><span class="tm-score__sub">Capped: major accident</span></div>
  </div>
</div>
</body></html>
