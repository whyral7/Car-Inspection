<!-- @dsCard group="Status" height=96 subtitle="Word plus glyph, never colour alone" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VerdictBadge</title></head>
<body class="tm-root" style="margin:0">
<div class="tm-pad tm-row">
  <span class="tm-verdict tm-verdict--pass"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg> Good</span>
  <span class="tm-verdict tm-verdict--attention"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M8 4.5v4.5"/><circle cx="8" cy="12" r="0.6" fill="currentColor"/><circle cx="8" cy="8" r="6.5" stroke-width="1.6"/></svg> Fair</span>
  <span class="tm-verdict tm-verdict--fail"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg> Poor</span>
  <span class="tm-verdict tm-verdict--na">N/A</span>
  <span class="tm-verdict tm-verdict--fail"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg> Major accident</span>
  <span class="tm-verdict tm-verdict--pass"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg> Non-accidental</span>
</div>
</body></html>
